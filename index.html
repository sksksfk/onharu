<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(n)=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const art=(n,cls='art')=>`<svg class="${cls}" aria-hidden="true"><use href="#art-${n}"/></svg>`;
const key='onharu-v1';
const day=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const time=()=>new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
const stamp=()=>new Date().toISOString();
const uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const defaults=()=>({version:1,profile:{name:'선생님',familyName:'가족',phone:'',place:'UN조각공원',walkGoal:15},meds:[],days:{},walks:[],projects:[],appointments:[],notes:[],large:false,speakReminders:false,reminders:false,notified:{}});
let state=defaults(),storageFailed=false;
try{const saved=localStorage.getItem(key);if(saved){const s=JSON.parse(saved);if(s.version===1&&Array.isArray(s.meds)&&s.days){state={...defaults(),...s,profile:{...defaults().profile,...s.profile}}}else storageFailed=true}}catch{storageFailed=true}
let current='today',todayKey=day(),toastId,submitHandler=null,returnFocus=null;
let timer={running:false,elapsed:0,start:0,goal:state.profile.walkGoal*60};
const pages=[['today','home','오늘 하루','오늘'],['meds','pill','약 챙기기','약'],['walk','walk','산책과 운동','산책'],['studio','bag','나의 공방','공방'],['records','book','하루 기록','기록']];
function save(){try{localStorage.setItem(key,JSON.stringify(state));storageFailed=false}catch{storageFailed=true}$('#storageError').hidden=!storageFailed;window.onharuPush?.onDataSave();}
function daily(){return state.days[day()]||{meds:{},mood:null}}
function writableDay(){const d=day();return state.days[d]||(state.days[d]={meds:{},mood:null})}
function activeMeds(){return state.meds.filter(m=>m.active!==false).sort((a,b)=>a.time.localeCompare(b.time))}
function notify(t){clearTimeout(toastId);$('#toast').textContent=t;toastId=setTimeout(()=>$('#toast').textContent='',6500)}
function speak(t){if(!('speechSynthesis'in window)){notify('이 브라우저는 읽어주기를 지원하지 않아요.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.85;speechSynthesis.speak(u)}
function navigate(p){current=p;render();$('#main').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}
function header(title,sub,extra=''){return `<div class="page-heading"><div><h1>${title}</h1><p>${sub}</p></div>${extra}</div>`}
function render(){
 document.body.classList.toggle('large',state.large);$('#largeBtn').setAttribute('aria-pressed',String(state.large));$('#storageError').hidden=!storageFailed;
 $('#dateLabel').innerHTML=`<span class="desktop-date">${new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</span><span class="compact-date">${new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'})}</span>`;
 $('#desktopNav').innerHTML=pages.map(([id,i,label])=>`<button data-page="${id}" class="${current===id?'active':''}" ${current===id?'aria-current="page"':''}>${icon(i)}${label}</button>`).join('');
 $('#mobileNav').innerHTML=pages.map(([id,i,,short])=>`<button data-page="${id}" class="${current===id?'active':''}" ${current===id?'aria-current="page"':''}>${icon(i)}${short}</button>`).join('');
 $('#main').innerHTML=({today:home,meds:medsPage,walk:walkPage,studio:studioPage,records:recordsPage,about:aboutPage}[current]||home)();
 updateTimer();
}
function displayTime(t){const [h,m]=String(t).split(':');const n=Number(h);return `${n<12?'오전':'오후'} ${n%12||12}:${m}`}
function medRows(compact=false){const meds=activeMeds();if(!meds.length)return `<div class="empty-med"><div class="icon-circle">${icon('pill')}</div><h3>아직 등록한 약이 없어요</h3><p>약봉투를 보고 등록해 주세요.</p><button class="primary" data-action="addMed">${icon('plus')}내 약 등록하기</button></div>`;
 return meds.map(m=>{const log=daily().meds[m.id];const status=log?.status;const overdue=!status&&time()>=m.time;return `<article class="med-row"><div class="row spread"><span class="med-time">${esc(displayTime(m.time))}</span><span class="status ${status==='skipped'?'skip':!status?'pending':''}">${status==='taken'?'먹었어요':status==='skipped'?'안 먹었어요':overdue?'예정 시각 지남':'먹을 예정'}</span></div><div class="med-name">${esc(m.name)}</div><p class="small muted">${esc(m.dose)}${m.note?' · '+esc(m.note):''}</p><div class="row" style="margin-top:12px">${status?`<span class="note">${esc(log.at)} 기록</span><button class="link-btn" data-action="undoMed" data-id="${esc(m.id)}">기록 취소</button>`:`<button class="primary" data-action="takeMed" data-id="${esc(m.id)}">${icon('check')}약 먹었어요</button><button class="link-btn" data-action="skipMed" data-id="${esc(m.id)}">안 먹었어요</button>`}${!compact?`<button class="link-btn" data-action="editMed" data-id="${esc(m.id)}">수정</button><button class="link-btn" data-action="deleteMed" data-id="${esc(m.id)}">삭제</button>`:''}</div></article>`}).join('')
}
function contactCard(){return `<section class="card home-contact"><h2 class="label">${icon('phone')}가족과 연락하기</h2><div class="contact-buttons"><button class="primary" data-action="callFamily">가족에게 전화</button><button class="secondary" data-action="share">안부 보내기</button></div><p class="note">안부는 직접 보내야 가족에게 전해져요.</p></section>`}
function home(){const d=daily();const done=activeMeds().filter(m=>d.meds[m.id]?.status==='taken').length;const walks=state.walks.filter(w=>w.day===day()).reduce((a,b)=>a+b.seconds,0);const mood=d.mood?.value;
 return header(`${esc(state.profile.name)}, 반갑습니다.`, '오늘도 하나씩, 천천히 챙겨요.',`<span class="pill"><span class="dot"></span>나를 돌보는 하루</span>`)+`
 <div class="home-grid"><section class="card hero"><div class="hero-copy"><div class="eyebrow">나를 챙기는 작은 일상</div><h2>몸도 마음도,<br>잘 챙기는 오늘.</h2><p>약 한 번, 산책 한 걸음.<br>작은 일상부터 함께 챙겨요.</p></div>${art('park','hero-art')}<div class="hero-bottom"><button class="primary" data-page="${activeMeds().length?'meds':'walk'}">${icon(activeMeds().length?'pill':'walk')}${activeMeds().length?'오늘의 약 확인하기':'오늘 산책 살펴보기'}${icon('arrow')}</button><div class="note" style="margin-top:12px">${walks?`오늘 ${Math.floor(walks/60)}분 산책을 기록했어요.`:'쉬어가는 날도 괜찮아요.'}</div></div></section>
 <section class="card med-card" aria-labelledby="medHomeTitle"><div class="card-heading"><h2 id="medHomeTitle" class="label">${icon('pill')}오늘의 약</h2><button class="link-btn" data-page="meds">${activeMeds().length?`${done} / ${activeMeds().length} 확인`:'약 관리'}</button></div>${medRows(true)}<div class="notice" style="margin-top:15px">약을 드셨는지 헷갈리면 더 드시지 말고 약사에게 확인해 주세요.</div><p class="note mobile-care-note">${esc(pushHint())}</p></section>
 ${contactCard()}
 <section class="card checkin"><div class="card-heading"><h2 class="label">${icon('heart')}오늘 마음은 어떠세요?</h2><span class="note">하루 안부</span></div><div class="moods">${['편안해요','조금 지쳐요','대화하고 싶어요'].map(x=>`<button class="mood ${mood===x?'active':''}" aria-pressed="${mood===x}" data-action="mood" data-value="${x}">${x}</button>`).join('')}</div><div class="check-status">${mood?`${esc(d.mood.at)}에 마음을 남겼어요. 가족에게 알리려면 ‘안부 보내기’를 눌러주세요.`:'남기고 싶은 마음을 골라주세요. 건너뛰어도 괜찮아요.'}</div></section></div>
 <div class="lower-grid"><section class="card activity"><div><div class="eyebrow">가까운 공원 산책</div><h2>가까운 공원 한 바퀴</h2><p>${esc(state.profile.place)}에서<br>편안한 속도로 걸어보세요.</p><button class="link-btn" data-page="walk">산책 살펴보기 ${icon('arrow')}</button></div>${art('park')}</section><section class="card activity artwork"><div><div class="eyebrow">나의 손으로 만드는 하루</div><h2>손끝에서 이어지는 일상</h2><p>만들고 있는 작품과<br>오늘의 생각을 남겨보세요.</p><button class="link-btn" data-page="studio">나의 공방 열기 ${icon('arrow')}</button></div>${art('leather')}</section></div>
 ${appointmentPreview()}
 <section class="card family-strip desktop-family"><div class="family-copy"><div class="icon-circle">${icon('phone')}</div><div><h2>목소리가 반가운 사람에게</h2><p>짧은 안부도, 함께 나누면 좋으니까요.</p></div></div><div class="row"><button class="secondary" data-action="callFamily">${icon('phone')}가족에게 전화</button><button class="secondary" data-action="share">${icon('share')}안부 공유</button></div></section>`
}

function medsPage(){return header('약 챙기기','약봉투와 처방을 확인하고, 드신 뒤에만 기록해 주세요.',`<button class="primary" data-action="addMed">${icon('plus')}약 등록</button>`)+`<div class="section-grid"><section class="card"><div class="card-heading"><h2>오늘의 복약 일정</h2><span class="pill">매일 같은 시각</span></div>${medRows()}</section><div class="stack">${pushPanel()}<section class="card text-block"><h2>안전하게 기록하는 방법</h2><ul class="bullet"><li>한 항목은 하루 한 번의 고정 시간입니다. 하루 두 번이면 시간별로 따로 등록해 주세요.</li><li>격일·주간·필요시 복용은 이 버전에서 지원하지 않아요.</li><li>시각이 지났다는 표시는 복용 지시가 아닙니다. 놓친 약의 복용법은 약사·의사에게 확인해 주세요.</li><li>약을 삭제해도 이전 복용 기록은 남습니다.</li></ul></section></div></div>`}
function walkPage(){const today=state.walks.filter(w=>w.day===day());return header('산책과 가벼운 운동','몸이 편안한 만큼만 걸어보세요.')+`<div class="section-grid walk-layout"><div class="stack walk-tools"><section class="card timer-panel"><h2>나의 산책 시계</h2><p class="note" style="margin:8px 0 18px">시간을 골라주세요. 무리하지 않아도 괜찮아요.</p><div class="chips">${[10,15,20].map(n=>`<button class="chip ${timer.goal===n*60?'active':''}" aria-pressed="${timer.goal===n*60}" data-action="goal" data-value="${n}" ${timer.running||timer.elapsed>0?'disabled':''}>${n}분</button>`).join('')}</div><div class="timer" id="timerValue" role="timer" aria-label="산책 경과 시간">00:00</div><div class="note" id="timerStatus">목표 ${timer.goal/60}분 · 준비되면 시작해 주세요</div><div class="progress" role="progressbar" aria-label="선택한 산책 시간 대비 경과" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="timerBar"></div></div><div class="row"><button class="primary" data-action="timer" id="timerButton">${icon('walk')}${timer.running?'잠시 쉬기':timer.elapsed?'이어서 걷기':'산책 시작'}</button><button class="secondary" data-action="finishWalk">마치고 기록</button></div><button class="link-btn" data-action="manualWalk" style="margin-top:12px">다녀온 산책 직접 적기</button><p class="note" style="margin-top:10px">화면을 닫기 전에 ‘마치고 기록’을 눌러주세요.</p><p class="note">이 시간은 운동 처방이 아니에요.</p></section><section class="card"><h2>오늘 걸은 시간</h2><p style="font-size:1.7rem;margin:12px 0">${Math.floor(today.reduce((a,w)=>a+w.seconds,0)/60)}<span class="small muted"> 분 기록</span></p><p class="note">직접 적은 시간과 산책 시계 기록을 합했어요.</p><button class="link-btn" data-action="exercise">집에서 몸 풀기 안내</button></section></div><section class="card park-details"><svg class="park-scene" aria-hidden="true"><use href="#art-park"/></svg><h2 style="font-size:1.45rem;margin:8px 0">${esc(state.profile.place)}</h2><p class="small muted">익숙한 길을 천천히 걸어보세요.<br>통증·어지럼·숨참이 생기면 멈추고 쉬세요.</p><details><summary>공원 위치와 산책 안내 보기</summary><div class="notice" style="margin:12px 0 18px">가족과 정확한 공원 위치와 안전한 길을 먼저 확인해 주세요. 경로·날씨·걸음 수는 측정하지 않아요. 아래 공식 안내는 UN조각공원 정보입니다.</div><div class="row"><a class="secondary" href="https://english.visitkorea.or.kr/svc/whereToGo/locIntrdn/rgnContentsView.do?vcontsId=140775" target="_blank" rel="noopener noreferrer">UN조각공원 안내 ${icon('arrow')}</a><button class="link-btn" data-action="settings">산책 장소 바꾸기</button></div></details></section></div>`}
function elapsed(){return timer.elapsed+(timer.running?(Date.now()-timer.start)/1000:0)}
function updateTimer(){const el=$('#timerValue');if(!el)return;const secs=Math.floor(elapsed());el.textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;const pct=Math.min(100,secs/timer.goal*100);$('#timerBar').style.width=pct+'%';$('#timerBar').parentElement.setAttribute('aria-valuenow',String(Math.round(pct)));$('#timerStatus').textContent=secs>=timer.goal?'선택한 시간이 지났어요. 무리하지 말고 쉬어가세요.':`목표 ${timer.goal/60}분 · ${timer.running?'걷는 중':secs?'잠시 쉬는 중':'준비되면 시작해 주세요'}`}

function recordsPage(){const dates=[...new Set([...Object.keys(state.days),...state.walks.map(w=>w.day)])].sort().reverse();const apps=state.appointments.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return header('하루 기록','작은 돌봄이 차곡차곡 쌓이고 있어요.',`<button class="secondary" data-action="export">기록 내려받기</button>`)+`<div class="section-grid"><section class="card"><div class="card-heading"><h2>건강과 안부 기록</h2><span class="note">기기 날짜 기준</span></div>${dates.length?dates.slice(0,30).map(date=>{const d=state.days[date];const logs=Object.values(d?.meds||{});const walks=state.walks.filter(w=>w.day===date);return `<article class="record-day"><h3>${esc(date)}</h3><ul>${d?.mood?`<li>마음: ${esc(d.mood.value)} (${esc(d.mood.at)})</li>`:''}${logs.map(l=>`<li>${esc(l.name)} · ${esc(l.scheduled)} · ${l.status==='taken'?'복용 기록':'건너뜀 기록'} (${esc(l.at)})</li>`).join('')}${walks.map(w=>`<li>산책 ${Math.floor(w.seconds/60)}분 ${w.seconds%60}초 · ${esc(w.place)}${w.manual?' (수동 입력)':''} <button class="link-btn" data-action="deleteWalk" data-id="${esc(w.id)}">기록 삭제</button></li>`).join('')}${!d?.mood&&!logs.length&&!walks.length?'<li>남아 있는 기록이 없어요.</li>':''}</ul></article>`}).join(''):'<div class="empty">안부나 복약, 산책을 기록하면<br>이곳에서 다시 볼 수 있어요.</div>'}<p class="note">최근 30일의 기록 있는 날짜를 표시해요. CSV 내려받기에는 전체 기록이 포함돼요. ‘복용 기록’은 본인이 누른 정보이며 실제 복용을 확인하는 장치가 아니에요.</p></section><div class="stack"><section class="card"><div class="card-heading"><h2>나의 약속</h2><button class="link-btn" data-action="appointment">+ 일정 등록</button></div>${apps.length?apps.map(a=>`<article class="list-row"><div class="row spread"><h3>${esc(a.title)}</h3><span class="status">${a.done?'완료':'예정'}</span></div><p>${esc(a.date)} ${esc(a.time)}<br>${esc(a.note)}</p><div class="row"><button class="link-btn" data-action="toggleAppointment" data-id="${esc(a.id)}">${a.done?'완료 취소':'완료로 표시'}</button><button class="link-btn" data-action="deleteAppointment" data-id="${esc(a.id)}">삭제</button></div></article>`).join(''):'<div class="empty">다음 진료와 가족 약속을 적어보세요.</div>'}<div class="notice" style="margin-top:15px">일정은 수첩에만 저장돼요. 일정 알림·자동 문자는 제공하지 않아요.</div></section><section class="card text-block"><h2>내 기록은 내 기기에</h2><p>약 이름·복용량·먹은 기록·안부·연락처·사진은 이 브라우저에 저장합니다. 서버 알림을 켠 경우에만 약 시각과 푸시 발송 정보를 Cloudflare에 저장해요. 다른 기기로 개인 기록이 자동 동기화되지는 않습니다.</p><p>공용 기기 사용은 피해주세요. 저장 데이터는 암호화되지 않아요. 중요한 기록은 주기적으로 내려받아 안전하게 보관해 주세요.</p><button class="secondary" data-action="backup">전체 백업(JSON)</button><button class="link-btn" data-action="reset" style="display:block;color:var(--danger);margin-top:18px">이 기기의 모든 기록 지우기</button></section></div></div>`}
function aboutPage(){return header('온하루 사용 안내','익숙한 일상을 지키는, 작은 생활 수첩.')+`<section class="card reading text-block"><h2>어떤 마음으로 만들었나요?</h2><p>오랜 시간 가르치고, 손으로 작품을 만드는 선생님의 일상에 맞췄습니다. 건강 기록만이 아니라 공방과 생각을 남기는 공간을 함께 담았습니다. 마음 기록은 선택사항이며, 대답을 강요하거나 슬픔을 평가하지 않아요.</p><h2 style="margin-top:25px">참고한 앱 3가지</h2><div class="source"><a href="https://medisafeapp.com/en/features" target="_blank" rel="noopener noreferrer">01 · Medisafe</a><p>복약 일정 관리와 복용 확인을 참고했어요. 원래 앱의 Medfriend 가족 알림과 달리, 온하루에는 가족 자동 알림이 없습니다.</p></div><div class="source"><a href="https://www.mytherapyapp.com/" target="_blank" rel="noopener noreferrer">02 · MyTherapy</a><p>복용·건너뜀 기록과 개인 건강 일지에서 착안해 하루 기록과 내려받기를 구성했어요. 의료기관 연동이나 약 상호작용 분석은 제공하지 않아요.</p></div><div class="source"><a href="https://snug.helpscoutdocs.com/article/25-welcome-to-snug" target="_blank" rel="noopener noreferrer">03 · Snug Safety</a><p>혼자 사는 분의 하루 한 번 안부 확인을 참고했어요. 원래 서비스의 미응답 연락 기능과 달리, 온하루는 본인이 공유 버튼을 눌러야 안부를 보낼 수 있어요.</p></div><div class="notice">요청하신 ‘약속해’는 정확한 공식 앱 정보를 확인하지 못해, 기능이 확인되는 위 3개 앱을 참고했습니다. 확인일: 2026년 11월 1일. 특정 앱과 제휴하거나 기능을 연동한 제품이 아닙니다.</div><h2 style="margin-top:28px">사용 전 꼭 알아주세요</h2><ul class="bullet"><li>이 HTML은 생활 기록용 시제품입니다. 의료기기·응급 감시 서비스가 아닙니다.</li><li>화면을 닫은 뒤 약 시간 안내는 ‘약’에서 이 기기의 서버 알림을 연결하고 알림을 허용해야 받을 수 있어요. 인터넷·휴대폰 설정·서버 상태에 따라 지연되거나 오지 않을 수 있어요. 미복약·미응답 자동 연락과 위치 추적은 지원하지 않아요.</li><li>매일 같은 시간에 먹는 약만 등록할 수 있어요. 처방 변경과 놓친 약의 복용은 의료진에게 확인해 주세요.</li><li>이름과 전화번호, 약 이름은 실제 정보로 미리 채우지 않았어요. 가족과 함께 설정해 주세요.</li><li>걷기 시간은 선택 예시일 뿐이에요. 담당 의료진의 운동 지침과 몸 상태를 우선해 주세요.</li><li>전화 버튼은 기기의 전화 앱을 엽니다. PC에서는 작동하지 않을 수 있어요. 자동으로 발신하지 않습니다.</li><li>‘안부 공유’는 공유 창 또는 복사할 문구를 보여줍니다. 전송은 본인이 최종 결정합니다.</li><li>파일을 옮기거나 다른 주소로 배포하면 기존 기록이 자동으로 옮겨지지 않아요. 백업은 보관용이며 이 버전에는 가져오기 기능이 없습니다.</li></ul><h2 style="margin-top:25px">공원 정보 출처</h2><p><a href="https://english.visitkorea.or.kr/svc/whereToGo/locIntrdn/rgnContentsView.do?vcontsId=140775" target="_blank" rel="noopener noreferrer">한국관광공사 · UN조각공원 안내</a><br>말씀하신 공원과 같은 곳인지 가족과 확인해 주세요. 안내 이미지는 실제 경로나 시설이 아닌 장식용 그림입니다.</p><div class="notice">공개되는 것은 앱 코드뿐입니다. 약 이름·복용량·먹은 기록·연락처·작품 사진·생활 기록은 GitHub에 전송되지 않습니다. 서버 알림을 켜면 매일의 약 시각(한국 시간)과 이 브라우저의 푸시 발송 정보를 Cloudflare에 저장합니다. Cloudflare의 서비스 운영 정보는 해당 개인정보 처리 정책을 따릅니다. 연결 해제에서 서버 정보를 지울 수 있어요. 개인 백업 파일은 공개 저장소에 올리지 마세요.</div></section>`}
function showDialog(title,body,handler=null){returnFocus=document.activeElement;submitHandler=handler;$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=handler?`<form id="modalForm">${body}</form>`:body;const dlg=$('#dialog');if(!dlg.open)dlg.showModal()}
function closeDialog(){const focus=returnFocus;$('#dialog').close();submitHandler=null;if(focus?.isConnected)focus.focus()}
function actions(label='저장하기'){return `<div class="form-actions"><button class="secondary" type="button" data-action="close">취소</button><button class="primary" type="submit">${label}</button></div>`}
function confirmAction(title,text,fn,label='확인'){showDialog(title,`<p class="small">${text}</p>${actions(label)}`,()=>{closeDialog();fn()})}
function medForm(id){const m=state.meds.find(x=>x.id===id);showDialog(m?'약 정보 수정':'약 등록',`<div class="notice">약봉투·처방전 내용을 그대로 적어주세요.</div><label class="field">약 이름<input name="name" required maxlength="60" value="${esc(m?.name||'')}" placeholder="약봉투에 적힌 이름"></label><label class="field">1회 복용량<input name="dose" required maxlength="60" value="${esc(m?.dose||'')}" placeholder="처방된 복용량을 그대로 입력"></label><label class="field">매일 복용할 시각<input name="time" type="time" required value="${esc(m?.time||'')}"></label><label class="field">복용 방법 메모 (선택)<input name="note" maxlength="150" value="${esc(m?.note||'')}" placeholder="약봉투의 식전·식후 등 안내"></label><p class="note">하루 두 번이면 시간을 나눠 등록해 주세요. 격일·필요시 복용은 등록하지 마세요.</p>${actions()}`,fd=>{const name=String(fd.get('name')).trim(),dose=String(fd.get('dose')).trim();if(!name||!dose){notify('약 이름과 복용량을 확인해 주세요.');return}if(state.meds.some(x=>x.active!==false&&x.id!==id&&x.name===name&&x.time===fd.get('time'))){notify('같은 이름과 시간의 약이 이미 있어요.');return}const obj={id:m?.id||uid(),name,dose,time:fd.get('time'),note:String(fd.get('note')).trim(),active:true};if(m)Object.assign(m,obj);else state.meds.push(obj);save();closeDialog();render();notify('약 일정을 저장했어요. 실제 처방과 한 번 더 확인해 주세요.')})}
function markMed(id,status){const m=state.meds.find(x=>x.id===id&&x.active!==false);if(!m||daily().meds[id])return;confirmAction(status==='taken'?'실제로 약을 드셨나요?':'안 먹은 것으로 기록할까요?',`<strong>${esc(m.name)} · ${esc(m.time)}</strong><br>${esc(m.dose)}<br><br>${status==='taken'?'약을 실제로 드신 뒤에만 기록해 주세요. 이 버튼은 약을 드시라는 지시가 아닙니다.':'이 기록은 복용을 생략해도 된다는 뜻이 아닙니다. 놓친 약은 약사·의사에게 복용법을 확인해 주세요.'}`,()=>{writableDay().meds[id]={name:m.name,dose:m.dose,scheduled:m.time,status,at:time(),created:stamp()};save();render();notify(status==='taken'?'복용 기록을 남겼어요.':'건너뜀을 기록했어요.')},status==='taken'?'네, 먹었어요':'안 먹은 것으로 기록')}
function settings(){showDialog('내 정보와 설정',`<p class="note">실명 없이 편한 호칭으로 사용할 수 있어요. 정보는 이 브라우저에만 저장됩니다.</p><label class="field">앱에서 부를 호칭<input name="name" required maxlength="20" value="${esc(state.profile.name)}" placeholder="예: 선생님"></label><label class="field">연락할 사람 호칭<input name="familyName" required maxlength="20" value="${esc(state.profile.familyName)}"></label><label class="field">가족 전화번호 (선택)<input name="phone" type="tel" inputmode="tel" maxlength="20" pattern="[+0-9 ()-]{7,20}" value="${esc(state.profile.phone)}" placeholder="가족과 함께 입력해 주세요"></label><label class="field">자주 가는 산책 장소<input name="place" required maxlength="60" value="${esc(state.profile.place)}"></label><label class="field">기본 산책 시간 (선택 예시)<select name="walkGoal">${[10,15,20].map(n=>`<option value="${n}" ${state.profile.walkGoal===n?'selected':''}>${n}분</option>`).join('')}</select></label><div class="notice">저장만으로 전화·문자가 발신되지 않아요. 가족에게 자동 알림은 제공하지 않습니다.</div>${actions()}`,fd=>{const p={name:String(fd.get('name')).trim(),familyName:String(fd.get('familyName')).trim(),phone:String(fd.get('phone')).trim(),place:String(fd.get('place')).trim(),walkGoal:Number(fd.get('walkGoal'))};if(!p.name||!p.familyName||!p.place){notify('호칭과 산책 장소를 확인해 주세요.');return}state.profile=p;if(!timer.running&&!timer.elapsed)timer.goal=p.walkGoal*60;save();closeDialog();render();notify('설정을 저장했어요.')})}
function summary(){const d=daily();const meds=activeMeds();const taken=meds.filter(m=>d.meds[m.id]?.status==='taken').length;const minutes=Math.floor(state.walks.filter(w=>w.day===day()).reduce((n,w)=>n+w.seconds,0)/60);return `[온하루 안부 · ${day()}]\n오늘 마음: ${d.mood?.value||'아직 남기지 않았어요'}\n복용 기록: ${meds.length?`${taken}/${meds.length}건`:'등록한 약 없음'}\n산책 기록: ${minutes}분\n직접 남긴 기록입니다. 자동 건강 확인 결과가 아닙니다.`}
function share(){showDialog('가족에게 안부 공유',`<p class="small muted">아래 문구를 확인하고 공유해 주세요. 약 이름·전화번호·사진은 포함하지 않았어요.</p><label class="field">공유할 안부<textarea id="shareText" rows="7" readonly>${esc(summary())}</textarea></label><div class="row"><button class="primary" data-action="nativeShare">${icon('share')}공유 창 열기</button><button class="secondary" data-action="copyShare">문구 복사</button></div><p class="note" style="margin-top:15px">지원되는 기기에서만 공유 창이 열려요. 전송 여부는 받는 앱에서 직접 확인해 주세요.</p>`)}
function help(){showDialog('도움이 필요하신가요?',`<p>가슴 통증, 심한 숨참 등 위급한 상황이라면 앱 기록보다 도움 요청이 먼저예요.</p><a class="danger-btn wide" href="tel:119" style="margin:22px 0">${icon('phone')}119 전화 앱 열기</a><button class="secondary wide" data-action="callFamily">${icon('phone')}${esc(state.profile.familyName)}에게 전화</button><p class="note" style="margin-top:17px">자동 신고·위치 전송은 하지 않아요. 전화 앱에서 발신을 확인해 주세요. PC에서는 전화가 지원되지 않을 수 있어요.</p>`)}
function projectForm(id){const p=state.projects.find(x=>x.id===id);showDialog(p?'작품 기록 수정':'오늘의 작품 남기기',`<label class="field">작품 이름<input name="title" required maxlength="70" value="${esc(p?.title||'')}" placeholder="무엇을 만들고 계신가요?"></label><label class="field">작업 상태<select name="stage">${['아이디어','작업 중','완성'].map(s=>`<option ${p?.stage===s?'selected':''}>${s}</option>`).join('')}</select></label><label class="field">작업 메모 (선택)<textarea name="note" maxlength="1200" placeholder="소재, 다음에 할 일, 남기고 싶은 생각">${esc(p?.note||'')}</textarea></label><label class="field">작품 사진 (선택)<input type="file" name="photo" accept="image/jpeg,image/png,image/webp"></label>${p?.photo?'<label class="check-field"><input type="checkbox" name="removePhoto">기존 사진 지우기</label>':''}<p class="note">사진은 기기 안에서 작게 줄여 저장합니다. JPG·PNG·WebP, 8MB 이하. 공방에는 사진이 없어도 기록할 수 있어요.</p>${actions('작품 저장')}`,async fd=>{const title=String(fd.get('title')).trim();if(!title){notify('작품 이름을 적어주세요.');return}const file=fd.get('photo');let photo=fd.get('removePhoto')?'':p?.photo||'';if(file&&file.size){if(file.size>8*1024*1024||!['image/jpeg','image/png','image/webp'].includes(file.type)){notify('8MB 이하 JPG·PNG·WebP 사진을 골라주세요.');return}try{photo=await shrinkPhoto(file)}catch{notify('이 사진을 읽을 수 없어요. 다른 사진을 골라주세요.');return}}const obj={id:p?.id||uid(),title,stage:String(fd.get('stage')),note:String(fd.get('note')).trim(),photo,date:p?.date||day()};if(p)Object.assign(p,obj);else state.projects.push(obj);save();closeDialog();render();notify(storageFailed?'저장 공간이 부족해요. 사진을 줄이거나 기록을 백업해 주세요.':'작품을 소중히 남겼어요.')})}
function shrinkPhoto(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{try{const ratio=Math.min(1,960/img.width,960/img.height);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.76))}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject()};img.src=url})}
function appointmentForm(){showDialog('일정 등록하기',`<label class="field">약속 이름<input name="title" required maxlength="80" placeholder="진료, 가족 식사, 공방 약속"></label><label class="field">날짜<input name="date" type="date" required value="${day()}"></label><label class="field">시각<input name="time" type="time" required></label><label class="field">장소나 메모 (선택)<input name="note" maxlength="150"></label><div class="notice">수첩에 저장하는 기능입니다. 일정 시각에 자동 알림은 오지 않아요.</div>${actions()}`,fd=>{const title=String(fd.get('title')).trim();if(!title){notify('약속 이름을 적어주세요.');return}state.appointments.push({id:uid(),title,date:String(fd.get('date')),time:String(fd.get('time')),note:String(fd.get('note')).trim(),done:false});save();closeDialog();render();notify('일정을 저장했어요.')})}
function recordWalk(seconds,manual=false){state.walks.push({id:uid(),day:day(),seconds,place:state.profile.place,manual,created:stamp()});save();timer={running:false,elapsed:0,start:0,goal:state.profile.walkGoal*60};render();notify('산책을 기록했어요. 편안히 쉬어가세요.')}
function manualWalk(){showDialog('다녀온 산책 기록',`<p class="small muted">오늘 걸은 시간을 직접 입력해 주세요. 기기가 측정한 시간이 아닙니다.</p><label class="field">걸은 시간 (분)<input name="minutes" required type="number" min="1" max="180" step="1" inputmode="numeric"></label>${actions('산책 기록')}`,fd=>{const n=Number(fd.get('minutes'));if(!Number.isInteger(n)||n<1||n>180)return;closeDialog();recordWalk(n*60,true)})}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(){const rows=[['날짜','종류','내용','예정 시각','기록 시각','상태']];for(const [dt,d]of Object.entries(state.days)){if(d.mood)rows.push([dt,'안부',d.mood.value,'',d.mood.at,'직접 기록']);for(const l of Object.values(d.meds||{}))rows.push([dt,'복약',`${l.name} / ${l.dose}`,l.scheduled,l.at,l.status==='taken'?'복용 기록':'건너뜀 기록'])}for(const w of state.walks)rows.push([w.day,'산책',`${w.seconds}초 / ${w.place}`,'','',w.manual?'수동 입력':'산책 시계']);for(const n of state.notes)rows.push([n.day,'한 줄',n.text,'','','직접 기록']);const csv=rows.map(row=>row.map(value=>{let v=String(value??'');if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}).join(',')).join('\r\n');download(`온하루_생활기록_${day()}.csv`,'\ufeff'+csv,'text/csv;charset=utf-8');notify('CSV 내려받기를 요청했어요. 민감한 기록은 안전하게 보관해 주세요.')}
function checkReminders(){if(!state.reminders||document.visibilityState!=='visible')return;for(const m of activeMeds()){const token=day()+m.id;const now=new Date();const diff=now.getHours()*60+now.getMinutes()-(Number(m.time.slice(0,2))*60+Number(m.time.slice(3)));if(diff>=0&&diff<10&&!daily().meds[m.id]&&!state.notified[token]){state.notified[token]=true;save();const msg=`${m.name}, 등록한 ${m.time} 일정이 있어요. 실제 처방과 복용 여부를 먼저 확인해 주세요.`;notify(msg);if(state.speakReminders)speak(msg)}}}
const handlers={
 close:closeDialog,addMed:()=>medForm(),editMed:id=>medForm(id),takeMed:id=>markMed(id,'taken'),skipMed:id=>markMed(id,'skipped'),
 undoMed:id=>confirmAction('복약 기록을 취소할까요?','기록만 지워집니다. 실제로 약을 드셨는지는 바뀌지 않아요. 중복 복용에 주의해 주세요.',()=>{delete writableDay().meds[id];save();render();notify('기록을 취소했어요. 실제 복용 여부를 다시 확인해 주세요.')},'기록 취소'),
 deleteMed:id=>confirmAction('이 약 일정을 삭제할까요?','앞으로의 매일 일정에서 지웁니다. 이전 복약 기록은 남아요.',()=>{state.meds.find(m=>m.id===id).active=false;save();render();notify('약 일정을 삭제했어요.')},'일정 삭제'),
 settings,help,share,appointment:appointmentForm,project:()=>projectForm(),editProject:id=>projectForm(id),
 deleteProject:id=>confirmAction('작품 기록을 삭제할까요?','저장한 사진과 메모를 지웁니다. 이 작업은 되돌릴 수 없어요.',()=>{state.projects=state.projects.filter(p=>p.id!==id);save();render()},'삭제'),
 deleteNote:id=>confirmAction('이 한 줄을 지울까요?','이 작업은 되돌릴 수 없어요.',()=>{state.notes=state.notes.filter(n=>n.id!==id);save();render()},'삭제'),
 deleteWalk:id=>confirmAction('산책 기록을 지울까요?','잘못 입력한 기록을 삭제합니다. 이 작업은 되돌릴 수 없어요.',()=>{state.walks=state.walks.filter(w=>w.id!==id);save();render()},'기록 삭제'),
 deleteAppointment:id=>confirmAction('이 일정을 지울까요?','이 작업은 되돌릴 수 없어요.',()=>{state.appointments=state.appointments.filter(a=>a.id!==id);save();render()},'삭제'),
 toggleAppointment:id=>{const a=state.appointments.find(a=>a.id===id);a.done=!a.done;save();render();notify(a.done?'완료로 표시했어요.':'예정으로 되돌렸어요.')},
 mood:(_,value)=>{writableDay().mood={value,at:time(),created:stamp()};save();render();notify(value==='대화하고 싶어요'?'마음을 남겼어요. 가족에게 전화하거나 안부를 직접 공유해 보세요.':'오늘의 마음을 남겼어요. 가족에게 자동 전송되지는 않아요.')},
 large:()=>{state.large=!state.large;save();render();notify(state.large?'글씨를 더 크게 바꿨어요.':'기본 글씨로 바꿨어요.')},
 read:()=>{speak(`${state.profile.name}, 오늘도 나의 속도로 천천히 챙겨요. ${summary().replace(/\n/g,'. ')}`)},
 about:()=>navigate('about'),
 callFamily:()=>{if(!state.profile.phone){settings();notify('가족 전화번호를 먼저 저장해 주세요.');return}showDialog('가족에게 전화',`<p>${esc(state.profile.familyName)}에게 전화할까요?</p><p style="font-size:1.3rem;margin:14px 0">${esc(state.profile.phone)}</p><a class="primary wide" href="tel:${esc(state.profile.phone.replace(/[^+0-9]/g,''))}">${icon('phone')}전화 앱 열기</a><p class="note" style="margin-top:15px">기기의 전화 앱에서 발신을 확인해 주세요. PC는 전화가 지원되지 않을 수 있어요.</p>`)},
 nativeShare:async()=>{if(!navigator.share){notify('이 기기는 공유 창을 지원하지 않아요. 문구 복사를 이용해 주세요.');return}try{await navigator.share({title:'온하루 안부',text:$('#shareText').value});notify('공유 창 처리를 마쳤어요. 전송 여부는 받는 앱에서 확인해 주세요.')}catch(e){if(e.name!=='AbortError')notify('공유 창을 열지 못했어요. 문구 복사를 이용해 주세요.')}},
 copyShare:async()=>{const el=$('#shareText');try{await navigator.clipboard.writeText(el.value);notify('안부 문구를 복사했어요. 보낼 앱에 붙여 넣어 주세요.')}catch{el.focus();el.select();notify('문구를 선택했어요. 길게 누르거나 Ctrl+C로 복사해 주세요.')}},
 goal:(_,v)=>{if(timer.running||timer.elapsed)return;timer.goal=Number(v)*60;render()},
 timer:()=>{if(timer.running){timer.elapsed=elapsed();timer.running=false}else{timer.start=Date.now();timer.running=true}render()},
 finishWalk:()=>{const secs=Math.floor(elapsed());if(secs<1){notify('산책 시작을 누르거나 다녀온 시간을 직접 입력해 주세요.');return}if(timer.running){timer.elapsed=elapsed();timer.running=false;render()}const finalSecs=Math.floor(timer.elapsed);confirmAction('오늘 산책을 남길까요?',`${Math.floor(finalSecs/60)}분 ${finalSecs%60}초를 ${esc(state.profile.place)} 산책 기록으로 저장합니다.`,()=>recordWalk(finalSecs),'산책 저장')},
 manualWalk,
 exercise:()=>showDialog('집에서 가볍게 몸 풀기',`<p class="small">담당 의료진이 허용한 범위에서만 움직여 주세요. 횟수나 시간을 억지로 채우지 않아도 괜찮아요.</p><ul class="bullet"><li>흔들리지 않는 의자에 편히 앉아 자세를 바로 해보세요.</li><li>손을 천천히 펴고 오므리거나 발목을 가볍게 움직여보세요.</li><li>통증·어지럼·숨참이 생기면 즉시 멈추고 쉬세요.</li><li>균형이 불안하면 혼자 서서 운동하지 마세요.</li></ul><div class="notice">개인별 운동 처방이 아닌 일반적인 생활 안내입니다.</div>`),
 break:()=>showDialog('손끝에도 잠깐의 쉼을',`<p>도구를 안전하게 내려두고, 손과 눈을 편히 쉬어보세요.</p><ul class="bullet"><li>잠시 먼 곳을 바라보며 눈을 쉬게 해주세요.</li><li>손과 어깨에 힘이 들어가 있지는 않은지 느껴보세요.</li><li>통증이나 저림이 있다면 작업을 멈추고 의료진에게 상담해 주세요.</li></ul><button class="primary wide" data-action="close">쉬었다가 천천히 이어갈게요</button>`),
 note:()=>showDialog('오늘의 한 줄',`<label class="field">남기고 싶은 생각<textarea name="text" required maxlength="1200" rows="5" placeholder="오늘 마음에 머문 것을 자유롭게 적어주세요."></textarea></label><p class="note">나만 보는 기록이에요. 쓰고 싶은 날에만 남기세요.</p>${actions('한 줄 저장')}`,fd=>{const text=String(fd.get('text')).trim();if(!text)return;state.notes.push({id:uid(),day:day(),text});save();closeDialog();render();notify('오늘의 한 줄을 남겼어요.')}),
 testReminder:()=>{notify('등록한 약 일정이 있어요. 실제 처방과 복용 여부를 먼저 확인해 주세요. 화면을 닫으면 안내가 오지 않아요.');if(state.speakReminders)speak('등록한 약 일정이 있어요. 실제 처방과 복용 여부를 먼저 확인해 주세요.')},
 export:exportCSV,
 reset:()=>showDialog('모든 개인 기록 지우기',`<div class="notice">이 브라우저에 저장한 개인 기록을 지우고, 이 기기의 서버 알림 연결도 해제합니다. 서버 연결 해제에는 인터넷이 필요해요. 되돌릴 수 없으니 필요한 기록은 먼저 백업해 주세요.</div><label class="field">정말 지우려면 ‘지우기’를 입력해 주세요.<input name="confirm" required autocomplete="off" placeholder="지우기"></label>${actions('모든 기록 삭제')}`,async fd=>{if(String(fd.get('confirm')).trim()!=='지우기'){notify('확인을 위해 ‘지우기’를 입력해 주세요.');return}if(!window.onharuPush&&localStorage.getItem('onharu-push-v1')){notify('알림 기능을 불러오지 못했어요. 새로 열어 알림 연결을 먼저 해제해 주세요.');return}if(window.onharuPush&&!await window.onharuPush.forget()){ notify('서버 알림 연결 해제를 확인하지 못했어요. 인터넷을 확인하고 다시 시도해 주세요.');return}state=defaults();timer={running:false,elapsed:0,start:0,goal:state.profile.walkGoal*60};save();closeDialog();current='today';render();notify('이 기기에 저장한 개인 기록을 모두 지웠어요.')}),
 backup:()=>confirmAction('전체 기록을 백업할까요?','약 정보·가족 연락처·작품 사진이 포함된 JSON 파일입니다. 안전한 곳에 보관해 주세요. 이 버전에는 백업 가져오기 기능이 없습니다.',()=>{download(`온하루_개인백업_${day()}.json`,JSON.stringify(state,null,2),'application/json');notify('백업 내려받기를 요청했어요. 저장 위치를 확인해 주세요.')},'백업 내려받기')
};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action],[data-page]');if(!b||b.disabled)return;if(b.dataset.page){navigate(b.dataset.page);return}const fn=handlers[b.dataset.action];if(fn){try{await fn(b.dataset.id,b.dataset.value)}catch{notify('처리하지 못했어요. 입력 내용을 확인하고 다시 시도해 주세요.')}}});
document.addEventListener('submit',async e=>{if(e.target.id!=='modalForm')return;e.preventDefault();if(!submitHandler)return;const submit=e.target.querySelector('[type=submit]');submit.disabled=true;try{await submitHandler(new FormData(e.target))}catch{notify('저장하지 못했어요. 입력 내용을 확인해 주세요.')}finally{if(submit.isConnected)submit.disabled=false}});
document.addEventListener('change',e=>{if(e.target.id==='reminderToggle'){state.reminders=e.target.checked;save();notify(state.reminders?'화면이 열려 있을 때만 안내해요. 휴대폰 기본 알람도 꼭 설정해 주세요.':'화면 내 복약 안내를 껐어요.')}if(e.target.id==='speakToggle'){state.speakReminders=e.target.checked;save();if(state.speakReminders)speak('음성 안내를 켰어요. 화면이 열려 있을 때만 안내합니다.')}});
$('#dialog').addEventListener('cancel',()=>{submitHandler=null});
window.addEventListener('beforeunload',e=>{if(timer.running||timer.elapsed>0){e.preventDefault();e.returnValue=''}});
setInterval(()=>{if(day()!==todayKey){todayKey=day();render()}updateTimer();checkReminders()},1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(day()!==todayKey){todayKey=day();render()}checkReminders();updateTimer()}});
render();
</script>
<script src="./push-client.js" defer></script>
</body>
</html>
